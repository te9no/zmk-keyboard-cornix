# Keep the 1200-baud UF2 trigger and a bounded CDC production log.
CONFIG_USB_DEVICE_STACK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_ZMK_USB_LOGGING=y

# Log link transitions and useful Bluetooth failures without the very noisy
# controller/HCI debug trace used during bring-up.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_CORNIX_BLE_LINK_MONITOR=y
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_BT_CONN_LOG_LEVEL_INF=y
CONFIG_BT_GATT_LOG_LEVEL_INF=y
CONFIG_BT_ATT_LOG_LEVEL_INF=y
CONFIG_BT_SMP_LOG_LEVEL_INF=y
CONFIG_BT_KEYS_LOG_LEVEL_INF=y
CONFIG_BT_SETTINGS_LOG_LEVEL_INF=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=1000
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_BACKEND_UART_BUFFER_SIZE=128
