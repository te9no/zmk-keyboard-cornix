CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_INPUT=y
CONFIG_MULTITHREADING=y
CONFIG_PM_DEVICE=y

CONFIG_ADC_INIT_PRIORITY=75
CONFIG_ADC_ADS1220=y
CONFIG_INPUT_ANALOG_AXIS_HIRES=y
CONFIG_INPUT_ANALOG_AXIS_HIRES_SETTINGS=n
CONFIG_INPUT_ANALOG_AXIS_HIRES_THREAD_STACK_SIZE=2048
CONFIG_INPUT_ANALOG_AXIS_HIRES_THREAD_PRIORITY=9

# The LPPS pipeline needs more room than a key-only central.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=1536
