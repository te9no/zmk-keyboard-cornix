# Drive the XIAO nRF52840's built-in red, green, and blue GPIO LEDs.
CONFIG_GPIO=y
CONFIG_CORNIX_CENTRAL_RGB_LED=y
CONFIG_CORNIX_CENTRAL_RGB_LED_DURATION_MS=120
CONFIG_CORNIX_CENTRAL_RGB_LED_BOOT_STATUS=y
# Do not disable RGBLED_WIDGET: Madula also uses an independent SPI WS2812.
# TPS43 has no widget enabled in its shield configuration.
