# Stable split timing for Cornix E73 peripherals.
# Interval units are 1.25 ms and timeout units are 10 ms.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=24
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=600

# Three host profiles plus the two reserved split-peripheral slots.
# Keeping the controller at five connections matches the proven Cornix TB
# three-device topology and avoids over-reserving nRF52 radio scheduler slots.
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Match the proven Cornix TB central configuration for link margin.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# The XIAO board does not select a persistent settings backend by itself in
# this configuration. Central host and split bonds must survive every reboot.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
