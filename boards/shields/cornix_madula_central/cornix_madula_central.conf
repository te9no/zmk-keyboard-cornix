# Stable split timing for the two Cornix E73 peripherals used by Madula.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=24
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=600

# Three host profiles and two split-peripheral connections.
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Preserve host and split bonds across central reboots.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# One board-mounted WS2812, with the same low-power status-widget approach as
# SparAkashaAnanta. Battery, connection, and layer indications share LED 0.
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_WS2812=y
CONFIG_RGBLED_WIDGET_LED_COUNT=1
CONFIG_RGBLED_WIDGET_SPATIAL_MAPPING=y
CONFIG_RGBLED_WIDGET_LED_SHARING=y
CONFIG_RGBLED_WIDGET_BATTERY_LED_INDEX=0
CONFIG_RGBLED_WIDGET_CONN_LED_INDEX=0
CONFIG_RGBLED_WIDGET_LAYER_LED_INDEX=0
CONFIG_RGBLED_WIDGET_LAYER_SHARE_BATTERY=y
CONFIG_RGBLED_WIDGET_LAYER_SHARE_CONN=y
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=y
CONFIG_RGBLED_WIDGET_LAYER_COLOR=7
CONFIG_RGBLED_WIDGET_BRIGHTNESS=32
CONFIG_RGBLED_WIDGET_EXT_POWER_TIMEOUT_MS=15000
