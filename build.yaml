---
include:
  # Cornix Madulo central with an interchangeable MeKaBu pointing module.
  # Both variants pair with the same cornix_ph_left/cornix_right peripherals
  # listed below; flash only one central variant at a time.
  - board: xiao_ble
    shield: cornix_madulo_central
    snippet: cornix-madulo-trackball zmk-usb-logging cornix-cdc-boot cornix-production-cdc
    artifact-name: cornix_madulo_trackball

  - board: xiao_ble
    shield: cornix_madulo_central
    snippet: cornix-madulo-trackpoint zmk-usb-logging cornix-cdc-boot cornix-production-cdc
    artifact-name: cornix_madulo_trackpoint

  # Production firmware
  - board: xiao_ble
    shield: cornix_tps43_central
    snippet: studio-rpc-usb-uart zmk-usb-logging cornix-cdc-boot cornix-production-cdc cornix-central-rgb-led cornix-dya-studio-v2
    artifact-name: cornix_tps43_production

  - board: cornix_ph_left
    snippet: zmk-usb-logging cornix-cdc-boot cornix-production-cdc cornix-peripheral-led cornix-dya-peripheral
    artifact-name: cornix_left_production

  - board: cornix_right
    snippet: zmk-usb-logging cornix-cdc-boot cornix-production-cdc cornix-peripheral-led cornix-dya-peripheral
    artifact-name: cornix_right_production

  # Pairing recovery while retaining a normal production runtime
  - board: xiao_ble
    shield: cornix_tps43_central
    snippet: studio-rpc-usb-uart zmk-usb-logging cornix-cdc-boot cornix-production-cdc cornix-host-bond-reset cornix-central-rgb-led cornix-dya-studio-v2
    artifact-name: cornix_tps43_host_bond_reset

  - board: cornix_ph_left
    snippet: zmk-usb-logging cornix-cdc-boot cornix-production-cdc cornix-peripheral-led cornix-dya-peripheral cornix-settings-reset-once
    artifact-name: cornix_left_bond_reset

  - board: cornix_right
    snippet: zmk-usb-logging cornix-cdc-boot cornix-production-cdc cornix-peripheral-led cornix-dya-peripheral cornix-settings-reset-once
    artifact-name: cornix_right_bond_reset

  # Full settings reset images
  - board: xiao_ble
    shield: settings_reset
    snippet: cornix-central-settings-reset
    artifact-name: cornix_tps43_settings_reset

  - board: cornix_ph_left
    shield: settings_reset
    snippet: nrf52840-nosd
    artifact-name: cornix_left_settings_reset

  - board: cornix_right
    shield: settings_reset
    snippet: nrf52840-nosd
    artifact-name: cornix_right_settings_reset
