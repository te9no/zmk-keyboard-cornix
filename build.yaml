---
include:
  # Madula central with an interchangeable MeKaBu pointing module.
  # All three variants pair with the same cornix_ph_left/cornix_right peripherals
  # listed below; flash only one central variant at a time.
  - board: xiao_ble//zmk
    shield: madula_central
    snippet: madula-trackball madula-dya-trackball studio-rpc-usb-uart zmk-usb-logging cornix-cdc-boot cornix-production-cdc madula-dya-studio-v2 cornix-central-rgb-led
    artifact-name: madula_trackball

  - board: xiao_ble//zmk
    shield: madula_central
    snippet: madula-trackpoint studio-rpc-usb-uart zmk-usb-logging cornix-cdc-boot cornix-production-cdc madula-dya-studio-v2 cornix-central-rgb-led
    artifact-name: madula_trackpoint

  - board: xiao_ble//zmk
    shield: madula_central
    snippet: madula-iqs studio-rpc-usb-uart zmk-usb-logging cornix-cdc-boot cornix-production-cdc madula-dya-studio-v2 cornix-central-rgb-led
    artifact-name: madula_iqs

  # Production firmware
  - board: xiao_ble//zmk
    shield: cornix_tps43_central
    snippet: studio-rpc-usb-uart zmk-usb-logging cornix-cdc-boot cornix-production-cdc cornix-central-rgb-led cornix-dya-studio-v2
    artifact-name: cornix_tps43_production

  - board: cornix_ph_left
    snippet: zmk-usb-logging cornix-cdc-boot cornix-production-cdc cornix-peripheral-led cornix-dya-peripheral
    artifact-name: cornix_left_production

  - board: cornix_right
    snippet: zmk-usb-logging cornix-cdc-boot cornix-production-cdc cornix-peripheral-led cornix-dya-peripheral
    artifact-name: cornix_right_production

  # Pairing recovery while retaining a normal production runtime
  - board: xiao_ble//zmk
    shield: cornix_tps43_central
    snippet: studio-rpc-usb-uart zmk-usb-logging cornix-cdc-boot cornix-production-cdc cornix-host-bond-reset cornix-central-rgb-led cornix-dya-studio-v2
    artifact-name: cornix_tps43_host_bond_reset

  - board: cornix_ph_left
    snippet: zmk-usb-logging cornix-cdc-boot cornix-production-cdc cornix-peripheral-led cornix-dya-peripheral cornix-settings-reset-once
    artifact-name: cornix_left_bond_reset

  - board: cornix_right
    snippet: zmk-usb-logging cornix-cdc-boot cornix-production-cdc cornix-peripheral-led cornix-dya-peripheral cornix-settings-reset-once
    artifact-name: cornix_right_bond_reset

  # Clear all Central split peripherals while retaining host profiles.
  # Both peripherals must be reset and paired again afterwards.
  - board: xiao_ble//zmk
    shield: madula_central
    snippet: zmk-usb-logging cornix-cdc-boot cornix-production-cdc cornix-split-bond-reset
    artifact-name: madula_split_bond_reset

  # Deep recovery for storage contaminated by firmware for another board.
  # This intentionally clears host profiles as well as split bonds.
  - board: xiao_ble//zmk
    shield: settings_reset
    snippet: cornix-central-settings-reset
    artifact-name: madula_factory_settings_reset

  # Full settings reset images
  - board: xiao_ble//zmk
    shield: settings_reset
    snippet: cornix-central-settings-reset
    artifact-name: cornix_tps43_settings_reset

  - board: cornix_ph_left
    shield: settings_reset
    snippet: nrf52840-nosd
    artifact-name: cornix_left_settings_reset

  - board: cornix_right
    shield: settings_reset
    snippet: nrf52840-nosd
    artifact-name: cornix_right_settings_reset
